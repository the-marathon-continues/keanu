name: macOS Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/macos/**'
      - 'apps/shared/**'
      - 'Swabble/**'
  pull_request:
    paths:
      - 'apps/macos/**'
      - 'apps/shared/**'
      - 'Swabble/**'
  workflow_dispatch:

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Select Xcode
        run: |
          # Use Xcode 26.1 for Swift 6 support
          if [ -d "/Applications/Xcode_26.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.1.app
          fi
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project apps/macos/Keanu.xcodeproj \
            -scheme Keanu

      - name: Build
        run: |
          xcodebuild build \
            -project apps/macos/Keanu.xcodeproj \
            -scheme Keanu \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
