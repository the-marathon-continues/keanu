name: Keanu Health Check
on:
  schedule:
    - cron: "0 12 * * *" # Noon UTC daily
  workflow_dispatch: {} # Manual trigger for testing

permissions:
  issues: write
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Run daily benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bun run gymnasium:daily 2>&1 | tee health-output.txt

      - name: Parse results
        id: results
        run: |
          # Extract pass/fail and key metrics from gymnasium output
          PASSED=$(grep -c "PASSED" health-output.txt || echo "0")
          FAILED=$(grep -c "FAILED" health-output.txt || echo "0")
          ALIVE_RATE=$(grep "alive_rate" health-output.txt | tail -1 | grep -oE '[0-9]+\.[0-9]+' || echo "0")
          BS_FREE=$(grep "bullshit_free" health-output.txt | tail -1 | grep -oE '[0-9]+\.[0-9]+' || echo "0")
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "alive_rate=$ALIVE_RATE" >> $GITHUB_OUTPUT
          echo "bs_free=$BS_FREE" >> $GITHUB_OUTPUT

      - name: Update health issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const passed = '${{ steps.results.outputs.passed }}';
            const failed = '${{ steps.results.outputs.failed }}';
            const aliveRate = '${{ steps.results.outputs.alive_rate }}';
            const bsFree = '${{ steps.results.outputs.bs_free }}';
            const date = new Date().toISOString().split('T')[0];

            const body = `## Health Check ${date}\n\n` +
              `| Metric | Value |\n|---|---|\n` +
              `| Passed | ${passed} |\n` +
              `| Failed | ${failed} |\n` +
              `| Alive Rate | ${aliveRate} |\n` +
              `| Bullshit-Free Rate | ${bsFree} |\n\n` +
              `<details><summary>Full output</summary>\n\n` +
              '```\n' + fs.readFileSync('health-output.txt', 'utf8').slice(0, 60000) + '\n```\n</details>';

            // Find or create pinned health issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'health-check',
              state: 'open',
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Keanu Daily Health Check',
                body,
                labels: ['health-check'],
              });
            }

            // Open regression issue if failures detected
            if (parseInt(failed) > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Health Regression: ${failed} failures on ${date}`,
                body: `Daily health check found ${failed} failing benchmarks.\n\n${body}`,
                labels: ['regression', 'needs-drew'],
              });
            }
