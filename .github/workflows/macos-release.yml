name: macOS App Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_config:
        description: "Build configuration"
        required: false
        default: "release"
        type: choice
        options:
          - debug
          - release

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: ai.keanu.mac
  BUILD_CONFIG: ${{ github.event.inputs.build_config || 'release' }}

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Control UI
        run: pnpm ui:build

      - name: Bundle canvas a2ui
        run: pnpm canvas:a2ui:bundle

      - name: Build and package macOS app
        env:
          BUILD_ARCHS: all
          APP_VERSION: ${{ github.ref_name }}
          ALLOW_ADHOC_SIGNING: "1"
          SKIP_TEAM_ID_CHECK: "1"
        run: |
          scripts/package-mac-app.sh

      - name: Create DMG
        run: |
          hdiutil create -volname "Keanu" \
            -srcfolder dist/Keanu.app \
            -ov -format UDZO \
            dist/Keanu.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Keanu-macOS
          path: |
            dist/Keanu.app
            dist/Keanu.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Keanu.dmg
          generate_release_notes: true
