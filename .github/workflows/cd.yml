name: CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (default: CalVer YYYY.M.DD.N)"
        required: false
        type: string
      skip_macos:
        description: "Skip macOS build"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: cd
  cancel-in-progress: false

env:
  BUNDLE_ID: ai.keanu.mac

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            Y=$(date -u +%Y)
            M=$(date -u +%-m)
            D=$(date -u +%-d)
            V="${Y}.${M}.${D}"
          fi

          # If tag exists, append .1, .2, etc.
          BASE="$V"
          SUFFIX=0
          while git rev-parse "v${V}" >/dev/null 2>&1; do
            SUFFIX=$((SUFFIX + 1))
            V="${BASE}.${SUFFIX}"
          done

          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "Version: v${V}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Bump version
        run: npm pkg set version=${{ steps.version.outputs.version }}

      - name: Create tarball
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARBALL="keanu-v${VERSION}.tar.gz"

          tar -czf "$TARBALL" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='*.test.ts' \
            --exclude='*.test.tsx' \
            --exclude='apps' \
            --exclude='vendor' \
            --exclude='.github' \
            extensions/ \
            src/ \
            dist/ \
            skills/ \
            assets/ \
            docs/ \
            keanu \
            install.sh \
            deploy-keanu.sh \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.json \
            vitest.config.ts \
            vitest.extensions.config.ts \
            LICENSE \
            README.md \
            CLAUDE.md

          echo "tarball=$TARBALL" >> "$GITHUB_ENV"
          echo "Created $TARBALL ($(du -h "$TARBALL" | cut -f1))"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag
        run: |
          git add package.json
          git commit -m "release: ${{ steps.version.outputs.tag }}" || true
          git tag "${{ steps.version.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ env.tarball }}" \
            --generate-notes \
            --title "keanu ${{ steps.version.outputs.tag }}"

  build-macos:
    runs-on: macos-latest
    needs: release
    if: ${{ !inputs.skip_macos }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Control UI
        run: pnpm ui:build

      - name: Bundle canvas a2ui
        run: pnpm canvas:a2ui:bundle

      - name: Build and package macOS app
        env:
          BUILD_ARCHS: all
          ALLOW_ADHOC_SIGNING: "1"
          SKIP_TEAM_ID_CHECK: "1"
        run: scripts/package-mac-app.sh

      - name: Create DMG
        run: |
          hdiutil create -volname "Keanu" \
            -srcfolder dist/Keanu.app \
            -ov -format UDZO \
            dist/Keanu.dmg

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.release.outputs.tag || github.ref_name }}"
          gh release upload "$TAG" dist/Keanu.dmg --clobber || true
