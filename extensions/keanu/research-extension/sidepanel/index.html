<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keanu Research</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1a1a1a;
        background: #fafafa;
        padding: 16px;
      }

      h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 16px;
        color: #111;
      }

      h2 {
        font-size: 14px;
        font-weight: 600;
        margin: 16px 0 8px;
        color: #333;
      }

      .section {
        background: white;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
        border: 1px solid #e0e0e0;
      }

      .search-box {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      .search-box input {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
      }

      .search-box input:focus {
        outline: none;
        border-color: #228b22;
      }

      .search-box button {
        padding: 8px 16px;
        background: #228b22;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
      }

      .search-box button:hover {
        background: #1a6f1a;
      }

      .baby {
        background: #f5f5f5;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 8px;
        border-left: 3px solid #228b22;
      }

      .baby.antithesis {
        border-left-color: #8b0000;
      }

      .baby-observation {
        font-size: 13px;
        margin-bottom: 6px;
      }

      .baby-meta {
        font-size: 11px;
        color: #666;
      }

      .baby-distinctiveness {
        display: inline-block;
        background: #228b22;
        color: white;
        padding: 2px 6px;
        border-radius: 10px;
        font-size: 10px;
        margin-left: 8px;
      }

      .baby.antithesis .baby-distinctiveness {
        background: #8b0000;
      }

      .status {
        font-size: 12px;
        color: #666;
        padding: 8px;
        background: #f0f0f0;
        border-radius: 6px;
        text-align: center;
      }

      .status.active {
        background: #e8f5e9;
        color: #228b22;
      }

      .empty-state {
        text-align: center;
        padding: 24px;
        color: #888;
      }

      .mode-toggle {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }

      .mode-toggle button {
        flex: 1;
        padding: 8px;
        border: 1px solid #ddd;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
      }

      .mode-toggle button.active {
        background: #228b22;
        color: white;
        border-color: #228b22;
      }

      .synthesis {
        background: #fffde7;
        border: 1px solid #fbc02d;
        border-radius: 6px;
        padding: 12px;
      }

      .synthesis-statement {
        font-size: 14px;
        line-height: 1.6;
      }

      .disagreement {
        background: #fff3e0;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 8px;
        border-left: 3px solid #ff9800;
      }

      .disagreement-type {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        color: #ff9800;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Keanu Research</h1>

    <div class="mode-toggle">
      <button id="research-mode" class="active">Research Mode</button>
      <button id="assist-mode">Assist Mode</button>
    </div>

    <div class="search-box">
      <input type="text" id="query-input" placeholder="What do you want to research?" />
      <button id="start-research">Go</button>
    </div>

    <div id="status" class="status">Ready to research</div>

    <div id="thesis-section" class="section" style="display: none">
      <h2>Thesis Babies</h2>
      <div id="thesis-babies"></div>
    </div>

    <div id="antithesis-section" class="section" style="display: none">
      <h2>Antithesis Babies</h2>
      <div id="antithesis-babies"></div>
    </div>

    <div id="disagreements-section" class="section" style="display: none">
      <h2>Disagreements</h2>
      <div id="disagreements"></div>
    </div>

    <div id="synthesis-section" class="section" style="display: none">
      <h2>Synthesis</h2>
      <div id="synthesis" class="synthesis"></div>
    </div>

    <script src="../build/panel.js" type="module"></script>
  </body>
</html>
