<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunset-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#87CEEB"/>
    </linearGradient>
    <linearGradient id="palm-trunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
    <linearGradient id="palm-frond" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#228B22"/>
      <stop offset="100%" stop-color="#006400"/>
    </linearGradient>
  </defs>

  <!-- Background circle with sunset gradient -->
  <circle cx="60" cy="60" r="55" fill="url(#sunset-sky)"/>

  <!-- Sun -->
  <circle cx="60" cy="75" r="20" fill="#FFD700" opacity="0.9"/>

  <!-- Palm trunk - curved -->
  <path d="M58 110 Q55 85 52 65 Q50 55 55 50"
        stroke="url(#palm-trunk)" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Palm fronds - left side -->
  <path d="M55 50 Q30 35 10 45" stroke="url(#palm-frond)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M55 50 Q25 30 15 25" stroke="url(#palm-frond)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M55 50 Q35 20 30 10" stroke="url(#palm-frond)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Palm fronds - right side -->
  <path d="M55 50 Q75 30 95 35" stroke="url(#palm-frond)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M55 50 Q80 25 100 20" stroke="url(#palm-frond)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M55 50 Q70 15 80 8" stroke="url(#palm-frond)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Top frond -->
  <path d="M55 50 Q60 25 65 10" stroke="url(#palm-frond)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Small coconuts -->
  <circle cx="52" cy="52" r="3" fill="#8B4513"/>
  <circle cx="58" cy="54" r="3" fill="#8B4513"/>
</svg>
