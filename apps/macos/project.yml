name: Keanu
options:
  bundleIdPrefix: ai.keanu
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

# SPM dependencies (existing)
packages:
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    exactVersion: "1.2.2"
  swift-subprocess:
    url: https://github.com/swiftlang/swift-subprocess.git
    from: "0.1.0"
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: "1.8.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.1"
  Peekaboo:
    url: https://github.com/steipete/Peekaboo.git
    branch: main
  KeanuKit:
    path: ../shared/KeanuKit
  Swabble:
    path: ../../Swabble

targets:
  # ============================================
  # LIBRARIES
  # ============================================

  KeanuIPC:
    type: framework
    platform: macOS
    sources:
      - Sources/KeanuIPC
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.keanu.ipc
      SWIFT_STRICT_CONCURRENCY: complete
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"

  KeanuDiscovery:
    type: framework
    platform: macOS
    sources:
      - Sources/KeanuDiscovery
    dependencies:
      - package: KeanuKit
        product: KeanuKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.keanu.discovery
      SWIFT_STRICT_CONCURRENCY: complete
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"

  KeanuExtensionKit:
    type: framework
    platform: macOS
    sources:
      - Sources/KeanuExtensionKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.keanu.extensionkit
      SWIFT_STRICT_CONCURRENCY: complete
      APPLICATION_EXTENSION_API_ONLY: YES
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"

  # ============================================
  # MAIN APP
  # ============================================

  Keanu:
    type: application
    platform: macOS
    sources:
      - path: Sources/Keanu
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: Sources/Keanu/Resources/Keanu.icns
      - path: Sources/Keanu/Resources/DeviceModels
    dependencies:
      - target: KeanuIPC
      - target: KeanuDiscovery
      - target: KeanuExtensionKit
      - package: KeanuKit
        product: KeanuKit
      - package: KeanuKit
        product: KeanuChatUI
      - package: KeanuKit
        product: KeanuProtocol
      - package: Swabble
        product: SwabbleKit
      - package: MenuBarExtraAccess
      - package: swift-subprocess
        product: Subprocess
      - package: swift-log
        product: Logging
      - package: Sparkle
      - package: Peekaboo
        product: PeekabooBridge
      - package: Peekaboo
        product: PeekabooAutomationKit
      # Embed system extensions
      - target: KeanuDNSProxy
        embed: true
        codeSign: true
    entitlements:
      path: Entitlements/Keanu.entitlements
    info:
      path: Sources/Keanu/Resources/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.keanu.mac
      INFOPLIST_FILE: Sources/Keanu/Resources/Info.plist
      SWIFT_STRICT_CONCURRENCY: complete
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      LD_RUNPATH_SEARCH_PATHS:
        - "@executable_path/../Frameworks"
      # System extension hosting
      SYSTEM_EXTENSION_API_REQUIRED: YES

  # ============================================
  # CLI
  # ============================================

  keanu-mac:
    type: tool
    platform: macOS
    sources:
      - Sources/KeanuMacCLI
    dependencies:
      - target: KeanuDiscovery
      - package: KeanuKit
        product: KeanuKit
      - package: KeanuKit
        product: KeanuProtocol
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.keanu.mac.cli
      SWIFT_STRICT_CONCURRENCY: complete

  # ============================================
  # SYSTEM EXTENSIONS
  # ============================================

  KeanuDNSProxy:
    type: system-extension
    platform: macOS
    sources:
      - Sources/KeanuDNSProxy
    dependencies:
      - target: KeanuExtensionKit
      - sdk: NetworkExtension.framework
    entitlements:
      path: Entitlements/KeanuDNSProxy.entitlements
    info:
      path: Sources/KeanuDNSProxy/Info.plist
      properties:
        CFBundleIdentifier: ai.keanu.dnsproxy
        CFBundleName: KeanuDNSProxy
        CFBundleDisplayName: Keanu DNS Proxy
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        NSSystemExtensionUsageDescription: "Keanu DNS Proxy logs DNS queries to help the AI agent understand network activity."
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.dns-proxy: $(PRODUCT_MODULE_NAME).DNSProxyProvider
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.keanu.dnsproxy
      SKIP_INSTALL: YES
      SWIFT_STRICT_CONCURRENCY: complete
      CODE_SIGN_ENTITLEMENTS: Entitlements/KeanuDNSProxy.entitlements
      # System extension settings
      PRODUCT_NAME: ai.keanu.dnsproxy
      WRAPPER_EXTENSION: systemextension
      MACH_O_TYPE: mh_bundle

  # ============================================
  # TESTS
  # ============================================

  KeanuIPCTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/KeanuIPCTests
    dependencies:
      - target: KeanuIPC
      - target: Keanu
      - target: KeanuDiscovery
      - package: KeanuKit
        product: KeanuProtocol
      - package: Swabble
        product: SwabbleKit
    settings:
      SWIFT_STRICT_CONCURRENCY: complete
      GENERATE_INFOPLIST_FILE: YES

  KeanuExtensionKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/KeanuExtensionKitTests
    dependencies:
      - target: KeanuExtensionKit
    settings:
      SWIFT_STRICT_CONCURRENCY: complete
      GENERATE_INFOPLIST_FILE: YES

# Schemes
schemes:
  Keanu:
    build:
      targets:
        Keanu: all
        KeanuDNSProxy: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KeanuIPCTests
        - KeanuExtensionKitTests
    archive:
      config: Release

  AllExtensions:
    build:
      targets:
        KeanuDNSProxy: all
    run:
      config: Debug
